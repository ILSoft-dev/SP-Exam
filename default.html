<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e79" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script>
    try {
      var t = localStorage.getItem('sp-theme'); if (t) document.documentElement.dataset.theme = t;
      var f = localStorage.getItem('sp-font'); if (f) document.documentElement.style.setProperty('--fs', f + 'px');
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">К содержимому</a>
  <header class="topbar">
    <button class="icon-btn" type="button" id="menu-btn" aria-label="Оглавление" aria-controls="drawer" aria-expanded="false">☰</button>
    <a class="topbar__title" href="{{ '/' | relative_url }}">СП · экзамен</a>
    <button class="icon-btn" type="button" id="font-btn" aria-label="Размер шрифта">Aa</button>
    <button class="icon-btn" type="button" id="theme-btn" aria-label="Сменить тему">🌓</button>
  </header>
  <div class="progress-line" id="read-progress" aria-hidden="true"></div>
  {% include nav.html %}
  <main id="main" class="page">
    {{ content }}
  </main>
  <footer class="footer">
    <p>Пособие по дисциплине «Системное программирование» (специальность 1-40 01 73 «Программное обеспечение информационных систем»).</p>
    <p><a href="#main">↑ Наверх</a></p>
  </footer>
  <button class="to-top" type="button" id="to-top" aria-label="Наверх" hidden>↑</button>
  <script>window.SP_BASE = "{{ site.baseurl }}";</script>
  <script src="{{ '/assets/app.js' | relative_url }}" defer></script>
</body>
</html>
